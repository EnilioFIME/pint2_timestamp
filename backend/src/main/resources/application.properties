# ==============================================================
# Configuración de conexión a Azure SQL Server
# ==============================================================
spring.datasource.url=jdbc:sqlserver://<TU_SERVIDOR>.database.windows.net:1433;databaseName=<TU_BASE_DE_DATOS>;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
spring.datasource.username=<TU_USUARIO>
spring.datasource.password=<TU_CONTRASEÑA>
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==============================================================
# Configuración de JPA / Hibernate
# ==============================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect