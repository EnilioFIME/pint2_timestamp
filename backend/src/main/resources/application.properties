# ============================================================
# CONFIGURACIÓN PÚBLICA — sin credenciales reales
# Copia este archivo como application-local.properties
# y llena los valores reales. ESE archivo nunca va a GitHub.
# ============================================================

server.port=8080

# Base de datos — reemplazar en application-local.properties
spring.datasource.url=jdbc:sqlserver://${SQLSERVER_HOST}.database.windows.net:1433;databaseName=${SQLSERVER_DB};encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
spring.datasource.username=${SQLSERVER_USER}
spring.datasource.password=${SQLSERVER_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# AWS Rekognition
aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY}
aws.region=us-west-1
aws.rekognition.collectionId=field-check-employees
aws.rekognition.similarityThreshold=90.0