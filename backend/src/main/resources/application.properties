# Puerto donde correrá tu localhost (opcional, por defecto es 8080)
# Generado por IA, no recuerdo cuanles eran mis credenciales al rato le pido ayuda a Luis o Nicolas
# Preparen un archivo identico a este PERO LLAMENLO COMO "application-local.properties" y ahi dentro si deberian ir las credenciales
server.port=8080

# Configuración de Azure SQL / SQL Server
spring.datasource.url=jdbc:sqlserver://<TU_SERVIDOR>.database.windows.net:1433;databaseName=<TU_BASE_DE_DATOS>;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
spring.datasource.username=<TU_USUARIO>
spring.datasource.password=<TU_CONTRASEÑA>
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# AWS Rekognition
aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY}
aws.region=us-east-2
aws.rekognition.collectionId=field-check-employees
aws.rekognition.similarityThreshold=90.0