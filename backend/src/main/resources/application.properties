# ==============================================================
# Configuración de conexión a Azure SQL Server
# Credenciales se leen de variables de entorno (no se commitean)
# ==============================================================
spring.datasource.url=jdbc:sqlserver://playground04.database.windows.net:1433;databaseName=TimeStamp;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==============================================================
# Configuración de JPA / Hibernate
# ==============================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Obligar a Hibernate a usar los nombres exactos de las tablas y columnas (Evita que convierta CreatedAt a created_at)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ==============================================================
# Credenciales del admin de la API (HTTP Basic Auth)
# También se leen de variables de entorno
# ==============================================================
app.admin.username=${APP_ADMIN_USER}
app.admin.password=${APP_ADMIN_PASSWORD}
